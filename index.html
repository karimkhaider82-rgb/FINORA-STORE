<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINORA - Global Store</title>
<link rel="alternate" hreflang="ar" href="?lang=ar">
<link rel="alternate" hreflang="fr" href="?lang=fr">
<link rel="alternate" hreflang="en" href="?lang=en">
<style>
:root{--main:#0f6e58}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}
body{background:#f8f9fa}
header{background:#111;color:#fff;padding:14px;position:sticky;top:0;z-index:100}
.nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.langs button{background:#222;color:#fff;border:1px solid #333;padding:6px 10px;border-radius:8px;margin-left:4px;cursor:pointer}
.langs button.active{background:var(--main)}
.hero{max-width:1200px;margin:14px auto;background:#fff;padding:14px;border-radius:14px;text-align:center}
.cats{max-width:1200px;margin:auto;display:flex;gap:8px;padding:0 14px;overflow:auto}
.cat{padding:8px 14px;background:#fff;border:1px solid #ddd;border-radius:20px;cursor:pointer;white-space:nowrap}
.cat.active{background:var(--main);color:#fff}
.grid{max-width:1200px;margin:14px auto;padding:0 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.card img{width:100%;height:190px;object-fit:cover}
.body{padding:10px}
.price{font-weight:900;color:var(--main);margin:6px 0}
.buy{display:block;background:var(--main);color:#fff;text-align:center;padding:10px;border-radius:8px;text-decoration:none;font-weight:700}
.note{max-width:1200px;margin:20px auto;background:#e8f5f1;padding:12px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<header>
<div class="nav">
<div id="storeName">FINORA</div>
<div class="langs">
<button onclick="setLang('ar')" id="b-ar">AR</button>
<button onclick="setLang('fr')" id="b-fr">FR</button>
<button onclick="setLang('en')" id="b-en">EN</button>
</div>
</div>
</header>
<div class="hero">
<h2 id="slogan"></h2>
<p id="shipping" style="font-size:12px;color:#666;margin-top:6px"></p>
<p id="howToBuy" style="font-size:12px;color:#888;margin-top:6px"></p>
</div>
<div class="cats">
<div class="cat active" data-cat="all" id="cat-all" onclick="filterCat('all')"></div>
<div class="cat" data-cat="kitchen" id="cat-kitchen" onclick="filterCat('kitchen')"></div>
<div class="cat" data-cat="home" id="cat-home" onclick="filterCat('home')"></div>
<div class="cat" data-cat="decor" id="cat-decor" onclick="filterCat('decor')"></div>
</div>
<div class="grid" id="grid"></div>
<div class="note" id="note"></div>
<script src="lang.js"></script>
<script src="products.js"></script>
<script>
let curLang = localStorage.getItem('finora_lang') || 'ar';
let curCat = 'all';
function setLang(l){
 curLang=l; localStorage.setItem('finora_lang',l); applyLang(); render();
 document.querySelectorAll('.langs button').forEach(b=>b.classList.remove('active'));
 document.getElementById('b-'+l).classList.add('active');
}
function applyLang(){
 const t=translations[curLang];
 document.documentElement.lang=curLang; document.documentElement.dir=t.dir;
 document.getElementById('storeName').textContent=t.storeName;
 document.getElementById('slogan').textContent=t.slogan;
 document.getElementById('shipping').textContent=t.shipping;
 document.getElementById('howToBuy').textContent=t.howToBuy;
 document.getElementById('cat-all').textContent=t.all;
 document.getElementById('cat-kitchen').textContent=t.kitchen;
 document.getElementById('cat-home').textContent=t.home;
 document.getElementById('cat-decor').textContent=t.decor;
}
function getLink(p){
 // إلا الزائر مغربي نعطيه جوميا، إلا أجنبي نعطيه AliExpress/Amazon
 const isMA = Intl.DateTimeFormat().resolvedOptions().timeZone.includes('Casablanca') || curLang==='ar';
 return isMA && p.links.ma ? p.links.ma : (p.links.world || p.links.ma);
}
function render(){
 const t=translations[curLang];
 let list = curCat==='all' ? products : products.filter(p=>p.category===curCat);
 document.getElementById('grid').innerHTML = list.map(p=>`
  <div class="card">
   <img src="${p.image}">
   <div class="body">
    <div style="font-size:13px;height:34px;overflow:hidden">${p.title[curLang]}</div>
    <div class="price">${curLang==='ar' ? p.priceMAD+' MAD' : '$'+p.priceUSD}</div>
    <a class="buy" href="${getLink(p)}" target="_blank">${t.buy}</a>
   </div>
  </div>
 `).join('');
}
function filterCat(c){
 curCat=c; document.querySelectorAll('.cat').forEach(el=>el.classList.toggle('active', el.dataset.cat===c)); render();
}
setLang(curLang);
</script>
</body>
</html>
