<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINORA STORE - أدوات المطبخ والمنزل</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f5f3f0;color:#222}
header{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:10}
.logo{font-weight:900;letter-spacing:1px}
.langs button{border:1px solid #ddd;background:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;margin-left:4px}
.langs button.active{background:#222;color:#fff}
.hero{background:#e9e6e2;padding:28px 20px;text-align:center}
.hero h1{font-size:22px;margin-bottom:6px}
.hero p{font-size:13px;color:#666}
.btns{margin-top:12px}
.btns a{display:inline-block;padding:8px 16px;border-radius:20px;text-decoration:none;font-size:13px;margin:4px}
.btn-dark{background:#222;color:#fff}
.btn-light{background:#fff;color:#222;border:1px solid #222}
.section{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;overflow:hidden;padding-bottom:10px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.card img{width:100%;height:150px;object-fit:cover;background:#eee}
.card h3{font-size:13px;margin:8px 6px;height:32px;overflow:hidden}
.card .price{font-weight:800;margin:4px 0}
.add{background:#222;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
.search{max-width:400px;margin:10px auto;display:flex}
.search input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:20px}
</style>
</head>
<body>
<header>
<div class="logo">FINORA<br><span style="font-size:11px;font-weight:400">STORE</span></div>
<div class="langs">
<button class="active" onclick="setLang('ar')">AR</button>
<button onclick="setLang('fr')">FR</button>
<button onclick="setLang('en')">EN</button>
</div>
</header>
<div class="hero">
<h1 id="hTitle">أدوات المطبخ - المنزل - الديكور</h1>
<p id="hSub">نختار لك أفضل المنتجات العصرية - جودة عالية و عملية</p>
<p style="font-size:11px;margin-top:8px;color:#888">Free shipping over €50 • 30-day returns • Secure checkout</p>
</div>
<div class="section">
<div class="search"><input id="search" placeholder="Search products... بحث..." oninput="filterSearch(this.value)"></div>
<h3 id="feat" style="margin:14px 0">المنتجات المميزة</h3>
<div class="grid" id="grid"></div>
</div>
<script>
// === هنا كتزيد منتجاتك - غير بدل الصورة والرابط ===
const products = [
{
  id:1,
  img:"https://ma.jumia.is/unsafe/fit-in/500x500/filters:fill(white)/product/61/149166/1.jpg?66114961",
  title:{ar:"قطاعة خضار 12 في 1", fr:"Hachoir Legume 12 en 1", en:"Manual Kitchen Chopper 12 in 1"},
  desc:{ar:"عملية وسهلة التنظيف", fr:"Compact facile à nettoyer", en:"Compact, easy to clean"},
  price:"12 يورو / 79 درهم",
  link:"https://www.jumia.ma/catalog/product/61/149166/1.jpg?66114961.html?s=KKjP8gG"
},
{
  id:2,
  img:"https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?w=400",
  title:{ar:"ساعة حائط عصرية", fr:"Horloge Murale Minimaliste", en:"Minimalist Wall Clock"},
  desc:{ar:"صامتة 30 سم", fr:"Silencieux 30cm", en:"Silent 30cm"},
  price:"18 يورو / 149 درهم",
  link:"https://jma.io/tgHEVsj"
},
{
  id:3,
  img:"https://images.unsplash.com/photo-1590794056226-79ef2a814047?w=400",
  title:{ar:"رف توابل خشب 12 علبة", fr:"Étagère à épices Bambou", en:"Bamboo Spice Rack (6 Jars)"},
  desc:{ar:"خشب طبيعي منظم", fr:"Rangement organisé", en:"Organised storage bamboo"},
  price:"15 يورو / 129 درهم",
  link:"https://jma.io/tgHEVsj"
}
];

let curLang='ar';
const t={
ar:{feat:"المنتجات المميزة",title:"أدوات المطبخ - المنزل - الديكور",sub:"نختار لك أفضل المنتجات العصرية - جودة عالية و عملية",buy:"اشتر الآن"},
fr:{feat:"Produits Vedettes",title:"Modern Homeware & Kitchen Tools",sub:"Curated essentials for your kitchen & home",buy:"Acheter"},
en:{feat:"Featured Products",title:"Modern Homeware & Kitchen Tools",sub:"Curated essentials for your kitchen & home — simple, functional, beautiful.",buy:"Add to Cart"}
};
function setLang(l){
curLang=l;
document.querySelectorAll('.langs button').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
document.documentElement.dir = l==='ar'?'rtl':'ltr';
document.getElementById('feat').textContent=t[l].feat;
document.getElementById('hTitle').textContent=t[l].title;
document.getElementById('hSub').textContent=t[l].sub;
render(products);
}
function render(list){
document.getElementById('grid').innerHTML=list.map(p=>`
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'">
<h3>${p.title[curLang]}</h3>
<div style="font-size:11px;color:#777">${p.desc[curLang]}</div>
<div class="price">${p.price}</div>
<a class="add" href="${p.link}" target="_blank">${t[curLang].buy}</a>
</div>`).join('');
}
function filterSearch(q){
const f=products.filter(p=>p.title[curLang].toLowerCase().includes(q.toLowerCase()));
render(f);
}
render(products);
</script>
</body>
</html>
